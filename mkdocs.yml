# Documentation site, published to GitHub Pages from the gh-pages branch.
# A push to master that changes the docs publishes them on its own
# (.github/workflows/docs.yml); to do it by hand:
#   python -m mkdocs serve       preview at http://127.0.0.1:8000
#   python -m mkdocs gh-deploy   build and push to gh-pages
site_name: Silverlight360.UnRAR
site_description: RAR extraction on the Xbox 360 for Silverlight360 apps, with UnRAR
site_url: https://digiex.github.io/Silverlight360.UnRAR/
repo_url: https://github.com/Digiex/Silverlight360.UnRAR
repo_name: Digiex/Silverlight360.UnRAR
edit_uri: edit/master/docs/
copyright: Silverlight360.UnRAR is licensed under the PolyForm Noncommercial License 1.0.0 with an additional condition; UnRAR keeps its own license. Xbox, Xbox 360 and Silverlight are trademarks of Microsoft.

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - powershell
    - csharp
    - bash
    - cpp
  navigation_depth: 3
  collapse_navigation: true

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition

nav:
  - Home: index.md
  - Adding it to an app: using.md
  - API: api.md
  - Building: building.md
  - Testing: testing.md
  - Limits: limits.md
  - Licenses: licenses.md
  - Contributing: contributing.md
  - Development: development.md
